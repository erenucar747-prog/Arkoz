<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arkoz — Sekme Düzeni Önizleme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --navy:#201161; --navy-dark:#180d49; --green:#4db848; --green-light:#6fca68;
      --red:#ce0e2d; --ink:#0e0a2a; --text:#333; --strong:#1a1a1a; --muted:#666;
      --line:#e7e7ec; --bg:#fff; --bg-soft:#fafafa;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{font-family:'Poppins',-apple-system,system-ui,sans-serif;color:var(--text);background:#eef0f4;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .wrap{max-width:460px;margin:0 auto;padding:14px 12px 60px}
    .note{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 14px;line-height:1.5}
    .note b{color:var(--navy)}

    /* ---- Kontrol çubuğu ---- */
    .controls{position:sticky;top:0;z-index:10;background:#eef0f4;padding:10px 0 12px;border-bottom:1px solid #dcdfe6;margin-bottom:16px}
    .controls__label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
    .seg{display:flex;gap:6px;background:#e1e4ea;border-radius:999px;padding:4px;margin-bottom:10px}
    .seg button{flex:1;border:none;background:none;font:600 12.5px 'Poppins';color:var(--muted);padding:9px 6px;border-radius:999px;cursor:pointer;transition:.18s}
    .seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(32,17,97,.12)}
    .seg--pages button.on{background:var(--navy);color:#fff}

    /* ---- Telefon kartı ---- */
    .phone{background:var(--bg);border-radius:22px;box-shadow:0 18px 50px rgba(14,10,42,.18);overflow:hidden;border:1px solid #e3e6ec}
    .phone__bar{height:30px;background:var(--navy);display:flex;align-items:center;justify-content:center}
    .phone__bar span{width:90px;height:5px;border-radius:5px;background:rgba(255,255,255,.4)}
    .pagehero{background:var(--bg-soft);padding:22px 18px 18px;border-bottom:1px solid var(--line)}
    .pagehero__logo{height:26px;display:block;margin-bottom:12px}
    .pagehero__eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0 0 4px}
    .pagehero__title{font:700 21px 'Poppins';color:var(--navy);margin:0;letter-spacing:-.01em}
    .pagehero__title em{font-style:normal;background:linear-gradient(135deg,var(--green-light),var(--green));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .body{padding:18px}

    /* ===== STIL: ŞİMDİ (mevcut) ===== */
    .demo--now .t-nav{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);margin-bottom:40px;overflow-x:auto}
    .demo--now .t-btn{position:relative;padding:20px;font:600 14px 'Poppins';color:var(--muted);white-space:nowrap;border:none;background:transparent;margin-bottom:-1px;cursor:pointer}
    .demo--now .t-btn.on{color:var(--navy)}
    .demo--now .t-btn.on::after{content:'';position:absolute;left:20px;right:20px;bottom:-1px;height:2px;background:var(--navy)}

    /* ===== STIL: A — pill-wrap (önerilen) ===== */
    .demo--A .t-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
    .demo--A .t-btn{min-height:44px;display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;font:600 13.5px 'Poppins';color:#444;background:rgba(32,17,97,.055);border:1px solid rgba(32,17,97,.12);white-space:nowrap;cursor:pointer;transition:background .18s,color .18s,border-color .18s;-webkit-tap-highlight-color:transparent}
    .demo--A .t-btn:hover{border-color:rgba(32,17,97,.3);color:var(--navy)}
    .demo--A .t-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 14px rgba(32,17,97,.22)}
    .demo--A .t-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}

    /* ===== STIL: B — tek satır kaydırmalı ===== */
    .demo--B .t-scroll{position:relative;margin-bottom:22px}
    .demo--B .t-scroll::after{content:'';position:absolute;top:0;right:0;bottom:0;width:34px;background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}
    .demo--B .t-nav{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding:2px 26px 6px 0;scrollbar-width:none}
    .demo--B .t-nav::-webkit-scrollbar{display:none}
    .demo--B .t-btn{flex:0 0 auto;scroll-snap-align:start;min-height:44px;display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;font:600 13.5px 'Poppins';color:#444;background:rgba(32,17,97,.055);border:1px solid rgba(32,17,97,.12);white-space:nowrap;cursor:pointer;transition:.18s}
    .demo--B .t-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

    /* içerik panel (ortak) */
    .t-panel{display:none;animation:fade .25s ease}
    .t-panel.on{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}}
    .t-panel h3{font:700 17px 'Poppins';color:var(--strong);margin:0 0 8px}
    .t-panel p{font-size:14px;line-height:1.65;color:var(--text);margin:0}
    .t-panel .pill-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:6px}

    .legend{margin-top:18px;font-size:12.5px;line-height:1.6;color:var(--muted)}
    .legend b{color:var(--navy)}
    .badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--green);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="note"><b>Arkoz — Mobil Sekme Düzeni Önizleme.</b><br>Gerçek site DEĞİŞTİRİLMEDİ. Aşağıdan stili ve sayfayı değiştir, sekmelere dokun. (İçerik temsilîdir; amaç düzeni göstermek.)</p>

    <div class="controls">
      <p class="controls__label">Stil</p>
      <div class="seg seg--style" id="segStyle">
        <button data-style="now">Şimdi (mevcut)</button>
        <button data-style="A" class="on">Öneri A · pill</button>
        <button data-style="B">Öneri B · kaydır</button>
      </div>
      <p class="controls__label">Sayfa</p>
      <div class="seg seg--pages" id="segPage">
        <button data-page="kurumsal" class="on">Kurumsal (7)</button>
        <button data-page="politikalar">Yasal (4)</button>
        <button data-page="gazbeton">Gazbeton (9)</button>
      </div>
    </div>

    <div class="phone">
      <div class="phone__bar"><span></span></div>
      <div class="pagehero">
        <img class="pagehero__logo" src="../logo.png" alt="Arkoz Gazbeton"
             onerror="this.style.display='none'" />
        <p class="pagehero__eyebrow" id="eyebrow">Kurumsal</p>
        <h2 class="pagehero__title" id="pageTitle">Arkoz <em>Gazbeton</em></h2>
      </div>
      <div class="body">
        <div class="demo demo--A" id="demo">
          <div class="t-scroll">
            <div class="t-nav" id="tNav" role="tablist" aria-label="Sayfa bölümleri"></div>
          </div>
          <div id="tPanels"></div>
        </div>
      </div>
    </div>

    <div class="legend" id="legend"></div>
  </div>

  <script>
    /* Gerçek sekme etiketleri + temsilî kısa içerik (yalnız düzen önizlemesi) */
    var PAGES = {
      kurumsal: {
        eyebrow:'Kurumsal', title:['Arkoz ','Gazbeton'],
        tabs:[
          ['Genel Tanıtım','Samsun Havza’da kurulu, Türkiye’nin en modern gazbeton üretim tesislerinden biri.'],
          ['Misyon ve Vizyon','Yapılara değer, yaşamlara konfor katan; sürdürülebilir ve yenilikçi çözümler.'],
          ['Tarihçe','Kuruluşundan bugüne yatırım, kapasite ve kalite odaklı büyüme.'],
          ['EYS Politikamız','Entegre Yönetim Sistemi: kalite, çevre, enerji ve iş güvenliği ilkeleri.'],
          ['Sürdürülebilirlik','Sıfır atık, yüksek enerji verimliliği ve düşük karbon ayak izi.'],
          ['İş Ortakları','Bayi ve tedarik ağı ile güçlü, uzun vadeli iş birlikleri.'],
          ['Belgelerimiz','ISO 9001/14001/50001/45001, CE ve TS-EN 771-4 belgeleri.']
        ]
      },
      politikalar: {
        eyebrow:'Yasal', title:['Gizlilik ve ','Politikalar'],
        tabs:[
          ['Kişisel Verilerin Korunması','KVKK kapsamında veri işleme, saklama ve haklara ilişkin esaslar.'],
          ['Gizlilik Politikası','Toplanan verilerin amacı, kapsamı ve korunma yöntemleri.'],
          ['Çerez Politikası','Zorunlu, analitik ve tercih çerezlerinin kullanımı ve yönetimi.'],
          ['AI Asistan ve Veri İşleme','Yapay zeka asistanında veri akışı ve gizlilik yaklaşımı.']
        ]
      },
      gazbeton: {
        eyebrow:'Neden Gazbeton', title:['Neden ','Gazbeton?'],
        tabs:[
          ['Neden Gaz Beton','Hafiflik, yalıtım ve güvenliği tek malzemede birleştiren çözüm.'],
          ['Değer Katar','Yapıya ve yaşam alanına ölçülebilir değer katar.'],
          ['Isı Yalıtımı','Düşük ısı iletim katsayısı ile yüksek enerji verimliliği.'],
          ['Deprem Güvenliği','Hafif yapısı sayesinde sismik yüklerde avantaj.'],
          ['Uygulama Kolaylığı','İnce derz yapıştırıcı ile hızlı, temiz ve düzgün uygulama.'],
          ['Ses Yalıtımı','Gözenekli yapısı ile etkili ses yalıtımı.'],
          ['Dayanım','Boyutsal kararlılık ve yüksek basınç dayanımı.'],
          ['Doğaya ve Çevreye Dost','Geri dönüştürülebilir, sıfır atık üretim.'],
          ['Yüksek Enerji Verimliliği','Üretimde ve kullanımda düşük enerji tüketimi.']
        ]
      }
    };

    var state = { style:'A', page:'kurumsal' };
    var demo = document.getElementById('demo');
    var tNav = document.getElementById('tNav');
    var tPanels = document.getElementById('tPanels');

    function render(){
      var data = PAGES[state.page];
      document.getElementById('eyebrow').textContent = data.eyebrow;
      document.getElementById('pageTitle').innerHTML = data.title[0] + '<em>' + data.title[1] + '</em>';
      demo.className = 'demo demo--' + state.style;
      tNav.innerHTML=''; tPanels.innerHTML='';
      data.tabs.forEach(function(t, i){
        var b=document.createElement('button');
        b.className='t-btn'+(i===0?' on':''); b.type='button';
        b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===0?'true':'false');
        b.textContent=t[0];
        b.addEventListener('click', function(){ select(i); });
        tNav.appendChild(b);
        var p=document.createElement('div');
        p.className='t-panel'+(i===0?' on':''); p.setAttribute('role','tabpanel');
        p.innerHTML='<span class="pill-tag">'+data.eyebrow+'</span><h3>'+t[0]+'</h3><p>'+t[1]+'</p>';
        tPanels.appendChild(p);
      });
      updateLegend();
    }
    function select(i){
      var btns=tNav.querySelectorAll('.t-btn'), pans=tPanels.querySelectorAll('.t-panel');
      btns.forEach(function(b,j){ b.classList.toggle('on', j===i); b.setAttribute('aria-selected', j===i?'true':'false'); });
      pans.forEach(function(p,j){ p.classList.toggle('on', j===i); });
      var active=btns[i]; if(active && active.scrollIntoView) active.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
    }
    function updateLegend(){
      var L={
        now:'<b>Şimdi (mevcut):</b> sekmeler düzensiz çok satıra sarıyor, aktif çizgi ile alt-border kopuk, içeriğe boşluk fazla (40px).',
        A:'<b>Öneri A (pill):</b> tüm sekmeler görünür, hizalı; aktif = dolu lacivert (net gösterge); boşluk 24px; dokunma hedefi ≥44px. <span class="badge">Önerilen</span>',
        B:'<b>Öneri B (kaydırmalı):</b> tek satır, en kompakt; sağ kenarda solma + kaydırma ipucu; bazı sekmeler kaydırınca görünür.'
      };
      document.getElementById('legend').innerHTML = L[state.style];
    }
    document.getElementById('segStyle').addEventListener('click', function(e){
      var b=e.target.closest('button'); if(!b)return;
      state.style=b.dataset.style;
      this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
      render();
    });
    document.getElementById('segPage').addEventListener('click', function(e){
      var b=e.target.closest('button'); if(!b)return;
      state.page=b.dataset.page;
      this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
      render();
    });
    render();
  </script>
</body>
</html>
