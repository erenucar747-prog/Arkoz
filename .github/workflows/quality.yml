name: Code Quality

# Her push (main) ve PR'da kod kalitesini denetler.
# ESLint = bloklayıcı (gerçek JS hataları). Prettier = bilgilendirici (format kayması raporu).
# Siteyi deploy ETMEZ; sadece "kod düzenli/profesyonel mi" kontrolü.

on:
  push:
    branches: [main, natro]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint araçlarını kur
        run: npm install --no-save --no-audit --no-fund eslint@^10 @eslint/js@^10 prettier@^3

      - name: ESLint — JS kalite (bloklayıcı)
        run: npx eslint .

      - name: Node testleri
        run: node --test tests/*.test.mjs

      - name: PHP sözdizimi
        run: |
          php -v
          for f in api/chat.php api/lib/*.php deploy/natro/*.php tests/php/*.php; do
            php -l "$f" || exit 1
          done

      - name: PHP birim testleri
        run: php tests/php/run.php

      - name: PHP entegrasyon testi
        run: bash tests/php/integration.sh

      - name: PHP 8.1 uyumluluk
        run: docker run --rm -v "$PWD":/app -w /app php:8.1-cli php tests/php/run.php

      - name: Prettier — format denetimi (bilgilendirici, bloklamaz)
        run: npx prettier --check "**/*.{js,css,html}"
        continue-on-error: true
